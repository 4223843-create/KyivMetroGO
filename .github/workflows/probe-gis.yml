name: Probe Kyiv GIS (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-gis.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='KyivMetroGO/1.0 (+https://github.com/4223843-create/KyivMetroGO)'
          for host in gisserver-stage.kyivcity.gov.ua gisserver.kyivcity.gov.ua; do
            for root in mayno/rest/services; do
              echo "=== $host/$root"
              curl -s -m 30 -A "$UA" "https://$host/$root?f=json" | head -c 4000; echo
              for folder in $(curl -s -m 30 -A "$UA" "https://$host/$root?f=json" | python3 -c 'import json,sys;print(" ".join(json.load(sys.stdin).get("folders",[])))' 2>/dev/null); do
                echo "--- folder $folder"
                curl -s -m 30 -A "$UA" "https://$host/$root/$folder?f=json" | head -c 3000; echo
              done
            done
          done
          echo "=== data.gov.ua"
          curl -s -m 30 -A "$UA" "https://data.gov.ua/api/3/action/package_search?q=%D0%B0%D0%B4%D1%80%D0%B5%D1%81%D0%BD%D0%B8%D0%B9+%D1%80%D0%B5%D1%94%D1%81%D1%82%D1%80+%D0%9A%D0%B8%D1%94%D0%B2&rows=8" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["result"]["results"]
          for p in d:
              print(p["title"], "|", p.get("organization",{}).get("title"))
              for r in p.get("resources",[])[:4]: print("   ", r.get("format"), r.get("url"))
          '
