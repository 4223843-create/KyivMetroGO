name: Probe Kyiv GIS (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-gis.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='KyivMetroGO/1.0 (+https://github.com/4223843-create/KyivMetroGO)'
          B=https://gisserver.kyivcity.gov.ua/mayno/rest/services/KYIV_API
          for svc in "Адреси/FeatureServer" "regaddress/FeatureServer" "Адреси_полі/MapServer"; do
            echo "=================== $svc"
            curl -s -m 30 -A "$UA" "$B/$svc?f=json" | head -c 2500; echo
            for L in 0 1 2; do
              echo "--- layer $L"
              curl -s -m 30 -A "$UA" "$B/$svc/$L?f=json" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          if "error" in d: print(d); raise SystemExit
          print(d.get("name"), d.get("geometryType"), "maxRecordCount", d.get("maxRecordCount"), "sr", (d.get("extent") or {}).get("spatialReference"))
          for f in d.get("fields",[]): print("   ", f["name"], f["type"], f.get("alias"))
          ' 2>&1 | head -60
              curl -s -m 30 -A "$UA" "$B/$svc/$L/query?where=1%3D1&returnCountOnly=true&f=json"; echo
              curl -s -m 30 -A "$UA" "$B/$svc/$L/query?where=1%3D1&outFields=*&resultRecordCount=3&outSR=4326&f=json" | head -c 2500; echo
            done
          done
