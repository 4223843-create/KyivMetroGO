name: Addresses → nearest station

# Перераховує public/addresses.json: для кожного будинку Києва з адресою —
# 3 найближчі станції метро за пішохідним маршрутом. Адреси й вулиці — ГІС Києва,
# пішохідна мережа — OSM (Geofabrik).
# Запуск вручну (Actions → Addresses → Run workflow); результат комітиться
# у гілку, з якої запущено.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/build-addresses.py"
      - ".github/workflows/addresses.yml"

permissions:
  contents: write

concurrency:
  group: addresses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          python -m pip install -q osmium scipy numpy shapely

      - name: Download OSM (Ukraine) and cut out Kyiv
        run: |
          curl -fsSL -A 'KyivMetroGO/1.0 (+https://github.com/4223843-create/KyivMetroGO)' \
            -o ukraine.osm.pbf https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
          ls -lh ukraine.osm.pbf
          osmium extract -b 30.10,50.15,31.00,50.65 --strategy=smart ukraine.osm.pbf -o bbox.osm.pbf
          osmium tags-filter bbox.osm.pbf r/boundary=administrative -o adm.osm.pbf
          osmium export adm.osm.pbf -f geojsonseq -o adm.geojsonseq --geometry-types=polygon
          python - <<'PY'
          import json
          for line in open('adm.geojsonseq', encoding='utf-8'):
              f = json.loads(line.lstrip('\x1e'))
              p = f.get('properties', {})
              if p.get('name') == 'Київ' and p.get('admin_level') == '4':
                  json.dump({'type': 'FeatureCollection', 'features': [f]}, open('kyiv.geojson', 'w'))
                  print('межа Києва знайдена')
                  break
          else:
              raise SystemExit('межу Києва не знайдено')
          PY
          osmium extract -p kyiv.geojson bbox.osm.pbf -o kyiv.osm.pbf
          ls -lh kyiv.osm.pbf

      - name: Download city addresses and streets (Kyiv GIS)
        run: |
          UA='KyivMetroGO/1.0 (+https://github.com/4223843-create/KyivMetroGO)'
          B='https://gisserver.kyivcity.gov.ua/mayno/rest/services/KYIV_API/%D0%90%D0%B4%D1%80%D0%B5%D1%81%D0%B8/FeatureServer'
          curl -fsS -m 300 -A "$UA" -o city-addresses.json \
            "$B/0/query?where=1%3D1&outFields=addrnumb1,addrcond,ukrnamef,type_vul,codetype,strcodeobj,district1&returnGeometry=true&outSR=4326&f=json"
          curl -fsS -m 300 -A "$UA" -o city-streets.json \
            "$B/1/query?where=1%3D1&outFields=strcodeobj,ukrnamef,codetype,districts&returnGeometry=true&outSR=4326&f=json"
          python - <<'PY'
          import json
          for name, minimum in (('city-addresses.json', 30000), ('city-streets.json', 2000)):
              d = json.load(open(name, encoding='utf-8'))
              n = len(d.get('features', []))
              print(name, n, 'exceeded' if d.get('exceededTransferLimit') else '')
              if n < minimum or d.get('exceededTransferLimit'):
                  raise SystemExit(f'{name}: неповні дані ({n})')
          PY

      - name: Build addresses.json
        run: python scripts/build-addresses.py kyiv.osm.pbf public/stations.json city-addresses.json city-streets.json public/addresses.json same-names.txt

      - name: Same-name streets in garden areas
        run: cat same-names.txt

      - name: Size and samples
        run: |
          ls -lh public/addresses.json
          gzip -9 -c public/addresses.json | wc -c | awk '{printf "gzip: %.0f KB\n", $1/1024}'
          python - <<'PY'
          import json
          d = json.load(open('public/addresses.json', encoding='utf-8'))
          ex = d['exits']
          want = ['Хрещатик', 'Миколи Бажана', 'Січових Стрільців', 'Лаврська', 'Саксаганського', 'Академіка Єфремова']
          for name, district, houses, parts, *_ in d['streets']:
              if any(w in name for w in want):
                  print(f'{name} ({district}): ' + ' · '.join(
                      f"{ex[int(p.split()[0])][0]} {int(p.split()[1])*10} м {' '.join(p.split()[2:])}" for p in parts.split('|') if p))
                  for h in houses.split('|')[:2] if houses else []:
                      p = h.split(' ')
                      res = ', '.join(f"{ex[int(p[i])][0]} вих.{ex[int(p[i])][1]} {int(p[i+1])*10} м" for i in range(1, len(p), 2))
                      print(f'   {p[0]}: {res}')
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/addresses.json
          git diff --cached --quiet && { echo "без змін"; exit 0; }
          git commit -m "Дані: адреси → найближчі станції пішки (OSM)"
          git push
