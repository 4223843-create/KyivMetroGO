name: Deploy to GitHub Pages

# Деплой лише після зеленої перевірки Check на main: зламаний коміт (дані,
# тести, збірка) не потрапляє на сайт, а звідти — і в застосунок Android.
on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # Лише успішний Check після пуша в main (не PR з гілки, яку теж звуть main)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Саме той коміт, який перевірив Check
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Беремо готову збірку!
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4