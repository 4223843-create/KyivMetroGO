name: Addresses → coordinates

# Перераховує public/addresses-geo.json: координати будинків з addresses.json
# (за адресами OSM) для кнопки «Поточне місцезнаходження» в пошуку.
# Міський ГІС не потрібен — лише OSM (Geofabrik) і вже зібраний addresses.json.
# Запуск вручну (Actions → Addresses → coordinates → Run workflow); результат
# комітиться у гілку, з якої запущено.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/build-addresses-geo.py"
      - ".github/workflows/addresses-geo.yml"

permissions:
  contents: write

concurrency:
  group: addresses-geo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          python -m pip install -q osmium scipy numpy shapely

      - name: Download OSM (Ukraine) and cut out Kyiv
        run: |
          curl -fsSL -A 'KyivMetroGO/1.0 (+https://github.com/4223843-create/KyivMetroGO)' \
            -o ukraine.osm.pbf https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
          osmium extract -b 30.10,50.15,31.00,50.65 --strategy=smart ukraine.osm.pbf -o kyiv.osm.pbf
          ls -lh kyiv.osm.pbf

      - name: Build addresses-geo.json
        run: python scripts/build-addresses-geo.py kyiv.osm.pbf public/stations.json public/addresses.json public/addresses-geo.json

      - name: Size
        run: |
          ls -lh public/addresses-geo.json
          gzip -9 -c public/addresses-geo.json | wc -c | awk '{printf "gzip: %.0f KB\n", $1/1024}'

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/addresses-geo.json
          git diff --cached --quiet && { echo "без змін"; exit 0; }
          git commit -m "Дані: координати будинків для поточного місцезнаходження (OSM)"
          git push
